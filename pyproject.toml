[project]
name = "evaltrix"
version = "0.0.1"
description = "Evals and governance for agent traces, judged by Jev."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyyaml>=6"]

[project.scripts]
evaltrix = "evaltrix.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaltrix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real Jev API (needs TYPESAFE_API_KEY)"]
